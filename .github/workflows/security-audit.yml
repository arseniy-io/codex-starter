name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run starter lint
        run: python3 scripts/starter-lint.py

      - name: Run security audit
        run: bash scripts/security-audit.sh
