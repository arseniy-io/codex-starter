name: Release Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  release-check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run all automatic release checks
        run: python scripts/release-check.py
